[package]
name = "tackc_lib"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thin-vec = { workspace = true, features = ["serde", "const_new"] }
rustc-hash = { workspace = true }
bumpalo = { workspace = true, features = ["std"] }
dashmap = { workspace = true }
proptest = { workspace = true }
thiserror = { workspace = true }
nonzero = { workspace = true }
derive_more = { workspace = true, features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["glob", "ron", "serde"] }

[build-dependencies]
tackc_meta = { workspace = true }
